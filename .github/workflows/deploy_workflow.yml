name: Database Deployment

on:
  push:
    branches: main
    
  workflow_dispatch:

jobs:

  deploy-buhle:
    uses: ./.github/workflows/deploy_template.yml
    with:
      environment_name: production
    secrets: inherit

  notify-shriya-approval:
    needs: deploy-buhle
    runs-on: windows-latest

    steps:
      - name: Send Approval Request Notification
        shell: powershell
        run: |
          $timestamp = Get-Date -Format "yyyy-MM-dd"

          $text = "DATABASE DEPLOYMENT - APPROVAL REQUIRED`n`nCreator: ${{ github.actor }}`n`nEnvironment: Shriya`n`nDate: $timestamp`n`nPlease approve this deployment in GitHub Environments."

          $payload = @{ text = $text } | ConvertTo-Json -Depth 1

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

  deploy-shriya:
    needs: notify-shriya-approval

    uses: ./.github/workflows/deploy_template.yml
    with:
      environment_name: Shriya
    secrets: inherit
