name: SSIS Execution Pipeline

on: 
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  run-ssis:

    runs-on: self-hosted

    env:
      TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}

    steps:

    # START NOTIFICATION
    
    - name: Notify Start
      shell: powershell
      run: |

        $body = @{
            text = "SSIS pipeline started on branch: main"
        } | ConvertTo-Json

        Invoke-RestMethod -Uri $env:TEAMS_WEBHOOK -Method Post -Body $body -ContentType "application/json"

    # CHECKOUT

    - name: Checkout Repo
      uses: actions/checkout@v4

    # VALIDATE PACKAGE

    - name: Validate DTSX Exists
      shell: powershell
      run: |

        if (!(Test-Path "Automation Project/Timesheet_Migration/Timesheet_Migration/Migration.dtsx"))
        {
            throw "SSIS package not found"
        }

    # EXECUTE SSIS PACKAGE
    
    - name: Execute SSIS Package
      shell: powershell
      run: |

        & "C:\Program Files\Microsoft SQL Server\160\DTS\Binn\dtexec.exe" `
          /FILE "Automation Project/Timesheet_Migration/Timesheet_Migration/Migration.dtsx"

    # VALIDATION

    - name: Validate Load
      shell: powershell
      run: |

        sqlcmd `
        -S "${{ secrets.SQL_SERVER }}" `
        -E `
        -d TimesheetDB `
        -Q "SELECT COUNT(*) AS EmployeeCount FROM Employee"

    # SUCCESS NOTIFICATION

    - name: Notify Success
      if: success()
      shell: powershell
      run: |

        $body = @{
            text = "SSIS Pipeline SUCCESSFUL. Data loaded into TimesheetDB."
        } | ConvertTo-Json

        Invoke-RestMethod -Uri $env:TEAMS_WEBHOOK -Method Post -Body $body -ContentType "application/json"

    # ROLLBACK (FAILURE)

    - name: Rollback
      if: failure()
      shell: powershell
      run: |

        Write-Host "Rollback triggered..."

        sqlcmd `
        -S "${{ secrets.SQL_SERVER }}" `
        -E `
        -d master `
        -Q "
        IF DB_ID('TimesheetDB') IS NOT NULL
        BEGIN
            DROP DATABASE TimesheetDB
        END"

    # FAILURE NOTIFICATION

    - name: Notify Failure
      if: failure()
      shell: powershell
      run: |

        $body = @{
            text = "SSIS Pipeline FAILED. Rollback executed for TimesheetDB."
        } | ConvertTo-Json

        Invoke-RestMethod -Uri $env:TEAMS_WEBHOOK -Method Post -Body $body -ContentType "application/json"
