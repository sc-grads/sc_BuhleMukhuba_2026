name: Timesheet Migration

on:
  workflow_dispatch:

jobs:
  run-dtsx:
    runs-on: self-hosted

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Validate DTSX Package Exists
        shell: powershell
        run: |
          $package = Get-ChildItem `
            -Path "Automation_Project" `
            -Recurse `
            -Filter "*.dtsx" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (!$package) {
            throw "No DTSX package was found inside Automation_Project."
          }

          Write-Host "DTSX package found:"
          Write-Host $package.FullName

      - name: Find DTExec
        shell: powershell
        run: |
          $dtexec = Get-ChildItem `
            -Path "C:\Program Files\Microsoft SQL Server" `
            -Recurse `
            -Filter "DTExec.exe" `
            -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (!$dtexec) {
            throw "DTExec.exe was not found. Install SQL Server Integration Services on the runner machine."
          }

          Write-Host "DTExec found:"
          Write-Host $dtexec.FullName

          "DTEXEC_PATH=$($dtexec.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

      - name: Run DTSX Package
        shell: powershell
        run: |
          $package = Get-ChildItem `
            -Path "Automation_Project" `
            -Recurse `
            -Filter "*.dtsx" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (!$package) {
            throw "DTSX package was not found."
          }

          if (!(Test-Path $env:DTEXEC_PATH)) {
            throw "DTExec path is invalid: $env:DTEXEC_PATH"
          }

          Write-Host "Running package:"
          Write-Host $package.FullName

          & "$env:DTEXEC_PATH" /FILE "$($package.FullName)"

          if ($LASTEXITCODE -ne 0) {
            throw "DTSX package execution failed with exit code $LASTEXITCODE."
          }

          Write-Host "DTSX package executed successfully."
