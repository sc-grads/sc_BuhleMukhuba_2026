name: Timesheet Migration

on: 
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  run-ssis:

    runs-on: self-hosted

    env:
      TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK_URL }}

    steps:

    # START NOTIFICATION

    - name: Notify Start
      shell: powershell
      run: |

        if (-not $env:TEAMS_WEBHOOK) {
            throw "TEAMS webhook URL is missing or not configured"
        }

        $payload = @{
            text = "SSIS Pipeline STARTED on branch: main"
        } | ConvertTo-Json -Depth 10

        try {
            Invoke-RestMethod `
                -Uri $env:TEAMS_WEBHOOK `
                -Method Post `
                -Body $payload `
                -ContentType "application/json"
        }
        catch {
            Write-Host "Failed to send Teams start notification: $($_.Exception.Message)"
        }


    # CHECKOUT

    - name: Checkout Repo
      uses: actions/checkout@v4


    # VALIDATE PACKAGE

    - name: Validate DTSX Exists
      shell: powershell
      run: |

        $packagePath = "Automation Project/Timesheet_Migration/Timesheet_Migration/Migration.dtsx"

        if (!(Test-Path $packagePath)) {
            throw "SSIS package not found at: $packagePath"
        }

        Write-Host "Package validated successfully"


    # EXECUTE SSIS PACKAGE

    - name: Execute SSIS Package
      shell: powershell
      run: |

        $packagePath = "Automation Project/Timesheet_Migration/Timesheet_Migration/Migration.dtsx"

        & "C:\Program Files\Microsoft SQL Server\130\DTS\Binn\DTExec.exe" `
          /FILE $packagePath


    # VALIDATION

    - name: Validate Load
      shell: powershell
      run: |

        sqlcmd `
        -S "${{ secrets.SQL_SERVER }}" `
        -E `
        -C `
        -TrustServerCertificate `
        -d TimesheetDB `
        -Q "SELECT COUNT(*) AS EmployeeCount FROM Employee"


    # SUCCESS NOTIFICATION

    - name: Notify Success
      if: success()
      shell: powershell
      run: |

        $payload = @{
            text = "SSIS Pipeline SUCCESSFUL. Data loaded into TimesheetDB."
        } | ConvertTo-Json -Depth 10

        try {
            Invoke-RestMethod `
                -Uri $env:TEAMS_WEBHOOK `
                -Method Post `
                -Body $payload `
                -ContentType "application/json"
        }
        catch {
            Write-Host "Failed to send success notification: $($_.Exception.Message)"
        }


    # ROLLBACK (FAILURE)

    - name: Rollback
      if: failure()
      shell: powershell
      run: |

        Write-Host "Rollback triggered..."

        sqlcmd `
        -S "${{ secrets.SQL_SERVER }}" `
        -E `
        -C `
        -TrustServerCertificate `
        -d master `
        -Q "
        IF DB_ID('TimesheetDB') IS NOT NULL
        BEGIN
            DROP DATABASE TimesheetDB
        END"


    # FAILURE NOTIFICATION

    - name: Notify Failure
      if: failure()
      shell: powershell
      run: |

        $payload = @{
            text = "SSIS Pipeline FAILED. Rollback executed for TimesheetDB."
        } | ConvertTo-Json -Depth 10

        try {
            Invoke-RestMethod `
                -Uri $env:TEAMS_WEBHOOK `
                -Method Post `
                -Body $payload `
                -ContentType "application/json"
        }
        catch {
            Write-Host "Failed to send failure notification: $($_.Exception.Message)"
        }
