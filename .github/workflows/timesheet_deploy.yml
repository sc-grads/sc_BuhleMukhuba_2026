name: Timesheet Migration

on:
  workflow_dispatch:

jobs:
  deploy-and-run:
    runs-on: self-hosted

    env:
      SQL_SERVER: ${{ secrets.SQL_SERVER }}
      SSIS_FOLDER: Migration
      SSIS_PROJECT: Timesheet_migration
      SQL_AGENT_JOB: Timesheet_Migration
      SSIS_PROJECT_PATH: Automation_Project\Timesheet_migration\Timesheet_migration\Timesheet_migration.dtproj

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Build SSIS Project Into ISPAC
        shell: powershell
        run: |
          if (!(Test-Path $env:SSIS_PROJECT_PATH)) {
              throw "SSIS project file not found: $env:SSIS_PROJECT_PATH"
          }

          $devenv = Get-ChildItem `
            -Path "C:\Program Files\Microsoft Visual Studio" `
            -Recurse `
            -Filter "devenv.com" `
            -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (!$devenv) {
              $devenvExe = Get-ChildItem `
                -Path "C:\Program Files\Microsoft Visual Studio" `
                -Recurse `
                -Filter "devenv.exe" `
                -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending |
                Select-Object -First 1

              if (!$devenvExe) {
                  throw "devenv.com/devenv.exe not found. Full Visual Studio with SSIS Projects support must be installed on the self-hosted runner."
              }

              $devenvPath = $devenvExe.FullName
          }
          else {
              $devenvPath = $devenv.FullName
          }

          Write-Host "Using Visual Studio:"
          Write-Host $devenvPath

          Write-Host "Building SSIS project:"
          Write-Host $env:SSIS_PROJECT_PATH

          & $devenvPath $env:SSIS_PROJECT_PATH /Build Development

          if ($LASTEXITCODE -ne 0) {
              throw "SSIS project build failed."
          }

          Write-Host "SSIS project built successfully."

      - name: Validate ISPAC Exists
        shell: powershell
        run: |
          $ispac = Get-ChildItem `
            -Path "Automation_Project" `
            -Recurse `
            -Filter "*.ispac" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (!$ispac) {
              throw "ISPAC file was not generated."
          }

          Write-Host "ISPAC found:"
          Write-Host $ispac.FullName

          "ISPAC_PATH=$($ispac.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

      - name: Get Package Name
        shell: powershell
        run: |
          $package = Get-ChildItem `
            -Path "Automation_Project" `
            -Recurse `
            -Filter "*.dtsx" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (!$package) {
              throw "No DTSX package found."
          }

          Write-Host "Package found:"
          Write-Host $package.Name

          "SSIS_PACKAGE=$($package.Name)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

      - name: Create SSIS Folder If Missing
        shell: powershell
        run: |
          $folder = $env:SSIS_FOLDER.Replace("'", "''")

          $sql = @"
          IF NOT EXISTS (
              SELECT 1
              FROM catalog.folders
              WHERE name = N'$folder'
          )
          BEGIN
              EXEC catalog.create_folder
                  @folder_name = N'$folder';

              PRINT 'SSIS folder created.';
          END
          ELSE
          BEGIN
              PRINT 'SSIS folder already exists.';
          END
          "@

          Invoke-Sqlcmd `
            -ServerInstance $env:SQL_SERVER `
            -Database "SSISDB" `
            -Query $sql `
            -ErrorAction Stop

      - name: Deploy ISPAC If Project Is Missing
        shell: powershell
        run: |
          if (!(Test-Path $env:ISPAC_PATH)) {
              throw "ISPAC path is invalid: $env:ISPAC_PATH"
          }

          $folder = $env:SSIS_FOLDER.Replace("'", "''")
          $project = $env:SSIS_PROJECT.Replace("'", "''")
          $ispacPath = $env:ISPAC_PATH.Replace("'", "''")

          $sql = @"
          IF NOT EXISTS (
              SELECT 1
              FROM catalog.projects p
              INNER JOIN catalog.folders f
                  ON p.folder_id = f.folder_id
              WHERE f.name = N'$folder'
                AND p.name = N'$project'
          )
          BEGIN
              DECLARE @ProjectBinary VARBINARY(MAX);

              SELECT @ProjectBinary = BulkColumn
              FROM OPENROWSET(
                  BULK '$ispacPath',
                  SINGLE_BLOB
              ) AS ProjectFile;

              EXEC catalog.deploy_project
                  @folder_name = N'$folder',
                  @project_name = N'$project',
                  @project_stream = @ProjectBinary;

              PRINT 'SSIS project deployed.';
          END
          ELSE
          BEGIN
              PRINT 'SSIS project already deployed. Deployment skipped.';
          END
          "@

          Invoke-Sqlcmd `
            -ServerInstance $env:SQL_SERVER `
            -Database "SSISDB" `
            -Query $sql `
            -ErrorAction Stop

      - name: Create SQL Server Agent Job If Missing
        shell: powershell
        run: |
          $jobName = $env:SQL_AGENT_JOB.Replace("'", "''")
          $folder = $env:SSIS_FOLDER.Replace("'", "''")
          $project = $env:SSIS_PROJECT.Replace("'", "''")
          $package = $env:SSIS_PACKAGE.Replace("'", "''")
          $scheduleName = "$jobName Every 30 Seconds"

          $jobStepCommand = @"
          DECLARE @execution_id BIGINT;

          EXEC SSISDB.catalog.create_execution
              @folder_name = N'$folder',
              @project_name = N'$project',
              @package_name = N'$package',
              @execution_id = @execution_id OUTPUT;

          EXEC SSISDB.catalog.start_execution
              @execution_id = @execution_id;
          "@

          $jobStepCommand = $jobStepCommand.Replace("'", "''")

          $sql = @"
          USE msdb;

          IF NOT EXISTS (
              SELECT 1
              FROM dbo.sysjobs
              WHERE name = N'$jobName'
          )
          BEGIN
              EXEC dbo.sp_add_job
                  @job_name = N'$jobName',
                  @enabled = 1,
                  @description = N'Runs the Timesheet SSIS package from SSISDB.';

              EXEC dbo.sp_add_jobstep
                  @job_name = N'$jobName',
                  @step_name = N'Run SSIS Package From SSISDB',
                  @subsystem = N'TSQL',
                  @database_name = N'master',
                  @command = N'$jobStepCommand',
                  @on_success_action = 1,
                  @on_fail_action = 2;

              EXEC dbo.sp_add_jobserver
                  @job_name = N'$jobName';

              PRINT 'SQL Server Agent job created.';
          END
          ELSE
          BEGIN
              PRINT 'SQL Server Agent job already exists. Job creation skipped.';
          END

          IF NOT EXISTS (
              SELECT 1
              FROM dbo.sysschedules
              WHERE name = N'$scheduleName'
          )
          BEGIN
              EXEC dbo.sp_add_schedule
                  @schedule_name = N'$scheduleName',
                  @enabled = 1,
                  @freq_type = 4,
                  @freq_interval = 1,
                  @freq_subday_type = 2,
                  @freq_subday_interval = 30,
                  @active_start_time = 000000;

              PRINT 'Schedule created: every 30 seconds.';
          END
          ELSE
          BEGIN
              EXEC dbo.sp_update_schedule
                  @name = N'$scheduleName',
                  @enabled = 1,
                  @freq_type = 4,
                  @freq_interval = 1,
                  @freq_subday_type = 2,
                  @freq_subday_interval = 30,
                  @active_start_time = 000000;

              PRINT 'Schedule already exists. Schedule updated to every 30 seconds.';
          END

          IF NOT EXISTS (
              SELECT 1
              FROM dbo.sysjobs j
              INNER JOIN dbo.sysjobschedules js
                  ON j.job_id = js.job_id
              INNER JOIN dbo.sysschedules s
                  ON js.schedule_id = s.schedule_id
              WHERE j.name = N'$jobName'
                AND s.name = N'$scheduleName'
          )
          BEGIN
              EXEC dbo.sp_attach_schedule
                  @job_name = N'$jobName',
                  @schedule_name = N'$scheduleName';

              PRINT 'Schedule attached to job.';
          END
          ELSE
          BEGIN
              PRINT 'Schedule already attached to job.';
          END
          "@

          Invoke-Sqlcmd `
            -ServerInstance $env:SQL_SERVER `
            -Database "msdb" `
            -Query $sql `
            -ErrorAction Stop
