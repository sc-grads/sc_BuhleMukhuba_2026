name: GitHub to Teams Notifications

on:
  pull_request:
    types: [opened, reopened, closed, synchronize, review_requested]
  pull_request_review:
    types: [submitted]
  push:
    branches:
      - "main"
  create:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Teams notification
        run: |
          EVENT="${{ github.event_name }}"
          ACTION="${{ github.event.action }}"
          TEXT=""
          DETAILS=""

          if [ "$EVENT" = "pull_request" ]; then
            if [ "$ACTION" = "opened" ]; then
              TEXT="New Pull Request Opened"
            elif [ "$ACTION" = "reopened" ]; then
              TEXT="Pull Request Reopened"
            elif [ "$ACTION" = "synchronize" ]; then
              TEXT="Pull Request Updated"
            elif [ "$ACTION" = "review_requested" ]; then
              TEXT="PR Approval/Review Requested"
            elif [ "$ACTION" = "closed" ]; then
              if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
                TEXT="Pull Request Merged into main"
              else
                TEXT="Pull Request Closed (not merged)"
              fi
            fi
            DETAILS="Repo: ${{ github.repository }} | Title: ${{ github.event.pull_request.title }} | Author: ${{ github.actor }}"

          elif [ "$EVENT" = "pull_request_review" ]; then
            REVIEW_STATE="${{ github.event.review.state }}"
            if [ "$REVIEW_STATE" = "approved" ]; then
              TEXT="Pull Request Approved"
              DETAILS="Repo: ${{ github.repository }} | Title: ${{ github.event.pull_request.title }} | Reviewer: ${{ github.actor }}"
            else
              # Ignore other review states (like comments or changes requested) if you only want approvals
              exit 0
            fi

          elif [ "$EVENT" = "push" ]; then
            TEXT="Push to ${{ github.ref_name }}"
            DETAILS="Repo: ${{ github.repository }} | Commit: ${{ github.sha }}"

          elif [ "$EVENT" = "create" ]; then
            TEXT="New Branch/Tag Created: ${{ github.ref_name }}"
            DETAILS="Repo: ${{ github.repository }} | Created By: ${{ github.actor }}"
          fi

          # Prevent empty payloads if an unhandled edge case occurs
          if [ -z "$TEXT" ]; then
            TEXT="GitHub Event: $EVENT"
            DETAILS="Repo: ${{ github.repository }}"
          fi

          # Generate valid O365 Message Card JSON format
          PAYLOAD=$(jq -n \
            --arg summary "$TEXT" \
            --arg title "$TEXT" \
            --arg text "$DETAILS" \
            '{
              "@type": "MessageCard",
              "@context": "http://schema.org",
              "summary": $summary,
              "title": $title,
              "text": $text
            }')

          # Wrapped the webhook URL in double quotes to prevent shell parsing errors
          curl -H "Content-Type: application/json" \
          -d "$PAYLOAD" \
          "${{ secrets.TEAMS_WEBHOOK_URL }}"
