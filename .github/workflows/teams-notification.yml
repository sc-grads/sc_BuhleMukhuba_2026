name: GitHub to Teams Notifications

on:
  pull_request:
    types: [opened, reopened, closed, synchronize]
  pull_request_review:
    types: [submitted]
  push:
    branches:
      - "**"
  create:

jobs:
  # JOB 1: Strictly intercepts branch creations (Both Local Push and GitHub UI)
  notify-branch-creation:
    runs-on: ubuntu-latest
    # Bulletproof condition: Fires if UI 'create' event OR if a push event has the native 'created' flag set to true
    if: |
      (github.event_name == 'create' && github.event.ref_type == 'branch') ||
      (github.event_name == 'push' && github.event.created == true)
    steps:
      - name: Send Branch Creation Notification
        run: |
          TEXT="New Branch Created"
          DETAILS="Repo: ${{ github.repository }} | Branch: ${{ github.ref_name }} | Created By: ${{ github.actor }}"
          
          PAYLOAD=$(jq -n --arg text "$TEXT" --arg details "$DETAILS" '{
            "type": "AdaptiveCard",
            "body": [
              { "type": "TextBlock", "size": "Medium", "weight": "Bolder", "text": $text },
              { "type": "TextBlock", "text": $details, "wrap": true }
            ],
            "$schema": "http://adaptivecards.io",
            "version": "1.4"
          }')
          
          curl -H "Content-Type: application/json" -d "$PAYLOAD" "${{ secrets.TEAMS_WEBHOOK_URL }}"

  # JOB 2: Intercepts Pull Requests, Reviews, and standard Commits (Excludes creations)
  notify-standard-events:
    runs-on: ubuntu-latest
    # Bulletproof condition: Only runs if it is NOT a branch creation event
    if: |
      github.event_name == 'pull_request' || 
      github.event_name == 'pull_request_review' || 
      (github.event_name == 'push' && github.event.created == false)
    steps:
      - name: Send Standard Event Notification
        run: |
          EVENT="${{ github.event_name }}"
          ACTION="${{ github.event.action }}"
          REVIEW_STATE="${{ github.event.review.state }}"
          TEXT=""
          DETAILS=""

          if [ "$EVENT" = "pull_request" ]; then
            if [ "$ACTION" = "opened" ]; then
              TEXT="New Pull Request Opened"
            elif [ "$ACTION" = "reopened" ]; then
              TEXT="Pull Request Reopened"
            elif [ "$ACTION" = "synchronize" ]; then
              TEXT="Pull Request Updated"
            elif [ "$ACTION" = "closed" ]; then
              if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
                TEXT="Pull Request Merged into main"
              else
                TEXT="Pull Request Closed (not merged)"
              fi
            fi
            DETAILS="Repo: ${{ github.repository }} | Title: ${{ github.event.pull_request.title }} | Author: ${{ github.actor }}"

          elif [ "$EVENT" = "pull_request_review" ]; then
            if [ "$REVIEW_STATE" = "approved" ]; then
              TEXT="Pull Request Approved"
              DETAILS="Repo: ${{ github.repository }} | Title: ${{ github.event.pull_request.title }} | Approved By: ${{ github.actor }}"
            else
              echo "Review state is $REVIEW_STATE. Skipping."
              exit 0
            fi

          elif [ "$EVENT" = "push" ]; then
            # Because of the job filter, this safely applies ONLY to standard modifications to main
            if [ "${{ github.ref_name }}" = "main" ]; then
              TEXT="Push to main branch"
              DETAILS="Repo: ${{ github.repository }} | Commit: ${{ github.sha }} | By: ${{ github.actor }}"
            else
              echo "Standard push to feature branch. Skipping notification."
              exit 0
            fi
          fi

          if [ -z "$TEXT" ]; then
            echo "No notification strings set. Skipping target."
            exit 0
          fi

          PAYLOAD=$(jq -n --arg text "$TEXT" --arg details "$DETAILS" '{
            "type": "AdaptiveCard",
            "body": [
              { "type": "TextBlock", "size": "Medium", "weight": "Bolder", "text": $text },
              { "type": "TextBlock", "text": $details, "wrap": true }
            ],
            "$schema": "http://adaptivecards.io",
            "version": "1.4"
          }')
          
          curl -H "Content-Type: application/json" -d "$PAYLOAD" "${{ secrets.TEAMS_WEBHOOK_URL }}"
