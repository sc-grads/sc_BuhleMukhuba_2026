name: Database Deployment

on:
  push:
    branches:
      - main
      - staging
      
  workflow_dispatch: 

jobs:
  deploy-database:
    runs-on: windows-latest

    # Map branch → environment
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'shriya' }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Notify Start (Teams)
        shell: powershell
        run: |
          $envName = "${{ github.ref_name == 'main' && 'production' || 'shriya' }}"

          $payload = @{
            text = "Database deployment starting.`nBranch: ${{ github.ref_name }}`nEnvironment: $envName`nUser: ${{ github.actor }}"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      - name: Execute SQL Script
        shell: powershell
        run: |
          sqlcmd `
            -S "${{ secrets.TUNNEL_URL }}" `
            -d "master" `
            -U "${{ secrets.SQL_USERNAME }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -C `
            -i "Automation Project/Deployment.sql"

      - name: Notify Success
        if: success()
        shell: powershell
        run: |
          $envName = "${{ github.ref_name == 'main' && 'production' || 'shriya' }}"

          $payload = @{
            text = "SUCCESS: Deployment completed.`nBranch: ${{ github.ref_name }}`nEnvironment: $envName"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      - name: Notify Failure
        if: failure()
        shell: powershell
        run: |
          $envName = "${{ github.ref_name == 'main' && 'production' || 'shriya' }}"

          $payload = @{
            text = "FAILED: Deployment failed.`nBranch: ${{ github.ref_name }}`nEnvironment: $envName"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"
