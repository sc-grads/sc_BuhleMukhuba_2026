name: Database Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  notify-approval:
    runs-on: windows-latest
    steps:
      - name: Send Teams Approval Request
        shell: powershell
        run: |
          $payload = @{
            text = @"
Database deployment approval required.

Creator: ${{ github.actor }}
Reviewer: Pending Approval

Please review and approve the production deployment in GitHub.
"@
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

  deploy-database:
    needs: notify-approval
    runs-on: windows-latest

    environment:
      name: production

    steps:
      - name: Notify Teams Approval Received
        shell: powershell
        run: |
          $payload = @{
            text = @"
Deployment approval received.

Creator: ${{ github.actor }}
Reviewer: ${{ github.triggering_actor }}

Database deployment is now starting.
"@
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Execute SQL Script
        shell: powershell
        run: |
          sqlcmd `
            -S "${{ secrets.PROJECT_URL }}" `
            -d "${{ secrets.DATABASE_NAME }}" `
            -U "${{ secrets.USER_NAME }}" `
            -P "${{ secrets.PASSWORD_SQL }}" `
            -C `
            -i "SQL Project/deploy.sql"

      - name: Notify Teams on Success
        if: success()
        shell: powershell
        run: |
          $payload = @{
            text = @"
Database deployment completed successfully.

Creator: ${{ github.actor }}
Reviewer: ${{ github.triggering_actor }}
"@
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      - name: Notify Teams on Failure
        if: failure()
        shell: powershell
        run: |
          $payload = @{
            text = @"
Database deployment failed.

Creator: ${{ github.actor }}
Reviewer: ${{ github.triggering_actor }}

Please check the GitHub Actions logs.
"@
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"
