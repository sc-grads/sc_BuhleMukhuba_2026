name: Database Deployment

on:
  push:
    branches:
      - main
      - staging

  workflow_dispatch:

jobs:

  deploy-database:
    runs-on: windows-latest

    steps:

      - name: Set Environment
        shell: powershell
        run: |
          if ("${{ github.ref_name }}" -eq "main") {
            echo "ENV_NAME=production" >> $env:GITHUB_ENV
          } else {
            echo "ENV_NAME=shriya" >> $env:GITHUB_ENV
          }

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Notify Start (Teams)
        shell: powershell
        run: |
          $payload = @{
            text = "Deployment starting`nBranch: ${{ github.ref_name }}`nEnvironment: $env:ENV_NAME`nUser: ${{ github.actor }}"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      - name: Execute SQL Script (Stable Method)
        shell: powershell
        run: |
          $server = "${{ secrets.TUNNEL_URL }}"
          $user = "${{ secrets.SQL_USERNAME }}"
          $pass = "${{ secrets.SQL_PASSWORD }}"
          $db = "master"

          $sql = Get-Content "Automation Project/Deployment.sql" -Raw

          $connString = "Server=$server;Database=$db;User ID=$user;Password=$pass;TrustServerCertificate=True;"

          $conn = New-Object System.Data.SqlClient.SqlConnection
          $conn.ConnectionString = $connString
          $conn.Open()

          $cmd = $conn.CreateCommand()
          $cmd.CommandTimeout = 120
          $cmd.CommandText = $sql
          $cmd.ExecuteNonQuery()

          $conn.Close()

      - name: Notify Success
        if: success()
        shell: powershell
        run: |
          $payload = @{
            text = "SUCCESS`nBranch: ${{ github.ref_name }}`nEnvironment: $env:ENV_NAME"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      - name: Notify Failure
        if: failure()
        shell: powershell
        run: |
          $payload = @{
            text = "FAILED`nBranch: ${{ github.ref_name }}`nEnvironment: $env:ENV_NAME"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"
