name: Database Deployment

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

jobs:

  # ----------------------------
  # STAGING DEPLOYMENT
  # ----------------------------
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: windows-latest
    environment:
      name: Shriya   # your staging environment

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Notify Staging Deployment Start
        shell: powershell
        run: |
          $payload = @{
            text = "STAGING DEPLOYMENT STARTED`nCreator: ${{ github.actor }}"
          } | ConvertTo-Json

          Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" -Method Post -Body $payload -ContentType "application/json"

      - name: Execute SQL Script (Staging)
        shell: powershell
        run: |
          sqlcmd `
            -S "${{ secrets.TUNNEL_URL }}" `
            -d "${{ secrets.STAGING_DB }}" `
            -U "${{ secrets.SQL_USERNAME }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -C `
            -b `
            -i "Automation Project/Deployment.sql"

      - name: Notify Staging Success
        if: success()
        shell: powershell
        run: |
          $payload = @{
            text = "STAGING DEPLOYMENT SUCCESSFUL`nCreator: ${{ github.actor }}"
          } | ConvertTo-Json

          Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" -Method Post -Body $payload -ContentType "application/json"

      - name: Notify Staging Failure
        if: failure()
        shell: powershell
        run: |
          $payload = @{
            text = "STAGING DEPLOYMENT FAILED`nCreator: ${{ github.actor }}"
          } | ConvertTo-Json

          Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" -Method Post -Body $payload -ContentType "application/json"


  # ----------------------------
  # PRODUCTION DEPLOYMENT
  # ----------------------------
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest

    environment:
      name: production   # GitHub protected environment

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Notify Approval Received
        shell: powershell
        run: |
          $payload = @{
            text = "PRODUCTION APPROVAL GRANTED`nCreator: ${{ github.actor }}`nDeployment starting..."
          } | ConvertTo-Json

          Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" -Method Post -Body $payload -ContentType "application/json"

      - name: Execute SQL Script (Production)
        shell: powershell
        run: |
          sqlcmd `
            -S "${{ secrets.TUNNEL_URL }}" `
            -d "${{ secrets.PROD_DB }}" `
            -U "${{ secrets.SQL_USERNAME }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -C `
            -b `
            -i "Automation Project/Deployment.sql"

      - name: Notify Teams on Success
        if: success()
        shell: powershell
        run: |
          $payload = @{
            text = "PRODUCTION DEPLOYMENT SUCCESSFUL`nCreator: ${{ github.actor }}"
          } | ConvertTo-Json

          Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" -Method Post -Body $payload -ContentType "application/json"

      - name: Notify Teams on Failure
        if: failure()
        shell: powershell
        run: |
          $payload = @{
            text = "PRODUCTION DEPLOYMENT FAILED`nCreator: ${{ github.actor }}"
          } | ConvertTo-Json

          Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" -Method Post -Body $payload -ContentType "application/json"
