on:
  workflow_dispatch: # Allows you to manually trigger the deployment from the GitHub Actions tab.
  push:
    branches:
      - main       # Triggers automatically when changes are pushed to the main branch.
 
jobs:
  deploy-database:
    runs-on: windows-latest
 
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        
      - name: Execute SQL Script
        shell: powershell
        run: |
          sqlcmd `
            -S "${{ secrets.TUNNEL_URL }}" `
            -d "${{ secrets.SQL_DATABASE }}" `
            -U "${{ secrets.SQL_USERNAME }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -C `
            -i "Automation Project/Deployment.sql"
