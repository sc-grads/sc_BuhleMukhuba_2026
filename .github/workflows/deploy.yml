name: Database Deployment

on:
  push:
    branches: ["main", "Staging"]

  workflow_dispatch:

jobs:

  # =========================================
  # STAGING (WITH APPROVAL + NOTIFICATIONS)
  # =========================================
  deploy-staging:
    if: github.ref_name == 'Staging'
    runs-on: windows-latest

    environment:
      name: Shriya

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Send Approval Request Notification (Teams)
        shell: powershell
        run: |
          $envName = "Shriya"
          $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

          $text = "DATABASE DEPLOYMENT - APPROVAL REQUIRED`n`nCreator: ${{ github.actor }}`nBranch: ${{ github.ref_name }}`nEnvironment: $envName`nDate/Time: $timestamp`n`nPlease approve this deployment in GitHub Environments."

          $payload = @{ text = $text } | ConvertTo-Json -Depth 1

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      - name: Execute SQL Script
        shell: powershell
        run: |
          sqlcmd `
            -S "${{ secrets.TUNNEL_URL }}" `
            -d "master" `
            -U "${{ secrets.SQL_USERNAME }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -C `
            -i "Automation Project/Deployment.sql"

      - name: Notify Success
        if: success()
        shell: powershell
        run: |
          $envName = "Shriya"
          $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

          $text = "DATABASE DEPLOYMENT - SUCCESS`n`nCreator: ${{ github.actor }}`nBranch: ${{ github.ref_name }}`nEnvironment: $envName`nDate/Time: $timestamp`n`nDeployment completed successfully."

          $payload = @{ text = $text } | ConvertTo-Json -Depth 1

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      - name: Notify Failure
        if: failure()
        shell: powershell
        run: |
          $envName = "Shriya"
          $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

          $text = "DATABASE DEPLOYMENT - FAILED`n`nCreator: ${{ github.actor }}`nBranch: ${{ github.ref_name }}`nEnvironment: $envName`nDate/Time: $timestamp`n`nDeployment failed. Please review the workflow logs."

          $payload = @{ text = $text } | ConvertTo-Json -Depth 1

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"


  # =========================================
  # MAIN (DIRECT DEPLOYMENT, NO APPROVAL)
  # =========================================
  deploy-production:
    if: github.ref_name == 'main'
    runs-on: windows-latest

    environment:
      name: production

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute SQL Script
        shell: powershell
        run: |
          sqlcmd `
            -S "${{ secrets.TUNNEL_URL }}" `
            -d "master" `
            -U "${{ secrets.SQL_USERNAME }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -C `
            -i "Automation Project/Deployment.sql"

      - name: Notify Success
        if: success()
        shell: powershell
        run: |
          $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

          $text = "DATABASE DEPLOYMENT - SUCCESS`n`nCreator: ${{ github.actor }}`nBranch: ${{ github.ref_name }}`nEnvironment: production`nDate/Time: $timestamp`n`nDeployment completed successfully."

          $payload = @{ text = $text } | ConvertTo-Json -Depth 1

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      - name: Notify Failure
        if: failure()
        shell: powershell
        run: |
          $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

          $text = "DATABASE DEPLOYMENT - FAILED`n`nCreator: ${{ github.actor }}`nBranch: ${{ github.ref_name }}`nEnvironment: production`nDate/Time: $timestamp`n`nDeployment failed. Please review the workflow logs."

          $payload = @{ text = $text } | ConvertTo-Json -Depth 1

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"
