on:
  workflow_dispatch:   # Manual trigger from GitHub Actions tab
  push:
    branches:
      - main           # Auto-trigger on push to main

jobs:
  deploy-database:
    runs-on: windows-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # ===============================
      # 1. SEND TEAMS APPROVAL REQUEST
      # ===============================
      - name: Send Teams Approval Request
        shell: powershell
        run: |
          $payload = @{
            type = "message"
            text = "🚨 Deployment Approval Required: Database deployment is ready. Please approve in GitHub Actions before continuing."
          } | ConvertTo-Json -Depth 10

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      # ===============================
      # 2. MANUAL APPROVAL GATE (PAUSE)
      # ===============================
      - name: Wait for Manual Approval
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -ne "workflow_dispatch") {
            Write-Host "❌ Deployment paused. Manual approval required."
            exit 1
          }

          Write-Host "✅ Approval received. Continuing deployment..."

      # ===============================
      # 3. EXECUTE SQL DEPLOYMENT
      # ===============================
      - name: Execute SQL Script
        shell: powershell
        run: |
          sqlcmd `
            -S "${{ secrets.TUNNEL_URL }}" `
            -d "${{ secrets.SQL_DATABASE }}" `
            -U "${{ secrets.SQL_USERNAME }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -C `
            -i "Automation Project/Deployment.sql"
