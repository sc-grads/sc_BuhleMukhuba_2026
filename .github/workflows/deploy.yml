name: Database Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  notify-approval:
    runs-on: windows-latest
    strategy:
      matrix:
        env: [production, shriya]

    steps:
      - name: Send Teams Approval Request
        shell: powershell
        run: |
          $payload = @{
            text = "Database deployment approval required.`nEnvironment: ${{ matrix.env }}`nCreator: ${{ github.actor }}.`nApprove in GitHub Environment: ${{ matrix.env }}"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

  deploy-database:
    needs: notify-approval
    runs-on: windows-latest
    strategy:
      matrix:
        env: [production, shriya]

    environment:
      name: ${{ matrix.env }}

    steps:

      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Notify Deployment Start
        shell: powershell
        run: |
          $payload = @{
            text = "Deployment starting.`nEnvironment: ${{ matrix.env }}`nCreator: ${{ github.actor }}"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      - name: Execute SQL Script
        shell: powershell
        run: |
          sqlcmd `
            -S "${{ secrets.TUNNEL_URL }}" `
            -d "master" `
            -U "${{ secrets.SQL_USERNAME }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -C `
            -i "Automation Project/Deployment.sql"

      - name: Notify Success
        if: success()
        shell: powershell
        run: |
          $payload = @{
            text = "SUCCESS: Database deployment completed.`nEnvironment: ${{ matrix.env }}`nCreator: ${{ github.actor }}"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      - name: Notify Failure
        if: failure()
        shell: powershell
        run: |
          $payload = @{
            text = "FAILED: Database deployment failed.`nEnvironment: ${{ matrix.env }}`nCreator: ${{ github.actor }}"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"
