name: Database Deployment

on:
  push:
    branches: ["main", "Staging"]

  workflow_dispatch:

jobs:

  deploy-database:
    runs-on: windows-latest

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'Shriya' }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Environment
        id: env
        shell: powershell
        run: |
          if ("${{ github.ref_name }}" -eq "main") {
            echo "ENV_NAME=production" >> $env:GITHUB_OUTPUT
          } else {
            echo "ENV_NAME=Shriya" >> $env:GITHUB_OUTPUT
          }

      - name: Send Approval Request Notification (Teams)
        shell: powershell
        run: |
          $envName = "${{ steps.env.outputs.ENV_NAME }}"
          $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

          $payload = @{
            text = @"
**DATABASE DEPLOYMENT - APPROVAL REQUIRED**

**Creator:** ${{ github.actor }}
**Branch:** ${{ github.ref_name }}
**Environment:** $envName
**Date/Time:** $timestamp

Please approve this deployment in GitHub Environments.
"@
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      - name: Execute SQL Script
        shell: powershell
        run: |
          sqlcmd `
            -S "${{ secrets.TUNNEL_URL }}" `
            -d "master" `
            -U "${{ secrets.SQL_USERNAME }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -C `
            -i "Automation Project/Deployment.sql"

      - name: Notify Success
        if: success()
        shell: powershell
        run: |
          $envName = "${{ steps.env.outputs.ENV_NAME }}"
          $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

          $payload = @{
            text = @"
**DATABASE DEPLOYMENT - SUCCESS**

**Creator:** ${{ github.actor }}
**Branch:** ${{ github.ref_name }}
**Environment:** $envName
**Date/Time:** $timestamp

Deployment completed successfully.
"@
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      - name: Notify Failure
        if: failure()
        shell: powershell
        run: |
          $envName = "${{ steps.env.outputs.ENV_NAME }}"
          $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

          $payload = @{
            text = @"
**DATABASE DEPLOYMENT - FAILED**

**Creator:** ${{ github.actor }}
**Branch:** ${{ github.ref_name }}
**Environment:** $envName
**Date/Time:** $timestamp

Deployment failed. Please review the workflow logs.
"@
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"
