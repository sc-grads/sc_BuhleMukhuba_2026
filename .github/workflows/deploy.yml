name: Database Deployment

on:
  push:
    branches:
      - main
      - staging

  workflow_dispatch:

jobs:

  deploy-database:
    runs-on: windows-latest

    steps:

      - name: Set Deployment Variables
        shell: powershell
        run: |
          if ("${{ github.ref_name }}" -eq "main") {
            echo "ENV_NAME=production" >> $env:GITHUB_ENV
          } else {
            echo "ENV_NAME=shriya" >> $env:GITHUB_ENV
          }

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Notify Start (Teams)
        shell: powershell
        run: |
          $payload = @{
            text = "Deployment starting`nBranch: ${{ github.ref_name }}`nEnvironment: $env:ENV_NAME`nUser: ${{ github.actor }}"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      - name: Execute SQL Script
        shell: powershell
        run: |
          sqlcmd `
            -S "${{ secrets.TUNNEL_URL }}" `
            -d "master" `
            -U "${{ secrets.SQL_USERNAME }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -C `
            -i "Automation Project/Deployment.sql"

      - name: Notify Success
        if: success()
        shell: powershell
        run: |
          $payload = @{
            text = "SUCCESS Branch: ${{ github.ref_name }}`nEnvironment: $env:ENV_NAME"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      - name: Notify Failure
        if: failure()
        shell: powershell
        run: |
          $payload = @{
            text = "FAILED Branch: ${{ github.ref_name }}`nEnvironment: $env:ENV_NAME"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"
