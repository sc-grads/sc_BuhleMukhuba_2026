jobs:
  deploy-database:
    runs-on: windows-latest

    environment:
      name: production

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Send Teams Approval Request
        shell: powershell
        run: |
          $payload = @{
            text = "Deployment awaiting approval in GitHub Environment: production"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      - name: Execute SQL Script
        shell: powershell
        run: |
          sqlcmd `
            -S "${{ secrets.TUNNEL_URL }}" `
            -d "${{ secrets.SQL_DATABASE }}" `
            -U "${{ secrets.SQL_USERNAME }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -C `
            -i "Automation Project/Deployment.sql"
