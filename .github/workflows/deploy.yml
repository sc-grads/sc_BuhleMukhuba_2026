name: Database Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  notify-approval:
    runs-on: windows-latest

    steps:
      - name: Send Teams Approval Request
        shell: powershell
        run: |
          $workflowUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          $payload = @{
            text = @"
DATABASE DEPLOYMENT APPROVAL REQUIRED

Repository: ${{ github.repository }}
Created By: ${{ github.actor }}

Approval Link:
$workflowUrl

Please review and approve this deployment in GitHub Environments.
"@
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

  deploy-database:
    needs: notify-approval
    runs-on: windows-latest

    environment:
      name: production

    steps:

      - name: Notify Deployment Started (Post Approval)
        shell: powershell
        run: |
          $payload = @{
            text = @"
DEPLOYMENT APPROVED AND STARTED

Repository: ${{ github.repository }}
Requested By: ${{ github.actor }}

Status: Approved via GitHub Environment

Deployment is now in progress.
"@
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Execute SQL Script
        shell: powershell
        run: |
          sqlcmd `
            -S "${{ secrets.PROJECT_URL }}" `
            -d "${{ secrets.DATABASE_NAME }}" `
            -U "${{ secrets.USER_NAME }}" `
            -P "${{ secrets.PASSWORD_SQL }}" `
            -C `
            -i "SQL Project/deploy.sql"

      - name: Notify Teams on Success
        if: success()
        shell: powershell
        run: |
          $payload = @{
            text = @"
DEPLOYMENT SUCCESSFUL

Repository: ${{ github.repository }}
Requested By: ${{ github.actor }}

Status: Completed successfully
"@
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"

      - name: Notify Teams on Failure
        if: failure()
        shell: powershell
        run: |
          $payload = @{
            text = @"
DEPLOYMENT FAILED

Repository: ${{ github.repository }}
Requested By: ${{ github.actor }}

Status: Check GitHub Actions logs for details
"@
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Method Post `
            -Body $payload `
            -ContentType "application/json"
